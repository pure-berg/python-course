# Запуск:  docker compose up -d        (из этой папки)
# Консоль: docker compose exec db psql -U course -d course
# Стоп:    docker compose down          (данные останутся в volume)
# С нуля:  docker compose down -v
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
      POSTGRES_DB: course
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  pgdata:
