name: Проверка

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  questions:
    name: Вопросы тренажёра (ответы проверяются запуском кода)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python tools/check_questions.py
      - run: node --check docs/app.js

  practice:
    name: Практика (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest
